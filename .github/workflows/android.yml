name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Copy web app into Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../sorty-mcsort-sort.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sorty-mcsort-sort-apk
          path: sorty-mcsort-sort.apk

      # Easiest way to get the APK onto a phone: a "latest" pre-release on the repo's Releases page.
      - name: Publish "latest" pre-release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest sorty-mcsort-sort.apk \
            --prerelease \
            --title "Latest build #${{ github.run_number }}" \
            --notes "Debug APK built from ${{ github.sha }}. On your phone: download, open, allow 'Install unknown apps' if asked."
